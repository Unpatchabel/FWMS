name: Build FWMS desktop installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: mac-apple-silicon
          - os: macos-15-intel
            label: mac-intel
          - os: windows-latest
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --reporter=dot
      - run: npm run desktop:smoke
      - run: node desktop/prepare.cjs
      - run: npx electron-builder --config desktop/builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node desktop/verify-package.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: fwms-${{ matrix.label }}
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.exe
          if-no-files-found: error
