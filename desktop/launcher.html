<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:" />
  <title>FWMS</title>
  <link rel="stylesheet" href="launcher.css" />
  <script src="launcher.js" defer></script>
</head>
<body>
  <main>
    <div class="mark">FWMS</div>
    <h1>Your finances, on your computer.</h1>
    <p class="description">Start your private ledger. On first use, you’ll create your owner account and choose its currency.</p>
    <button id="start" type="button">Start FWMS</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="error" role="alert" hidden></p>
  </main>
</body>
</html>
