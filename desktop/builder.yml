appId: com.unpatchabel.fwms
productName: FWMS
directories:
  output: dist-desktop
files:
  - desktop/main.cjs
  - desktop/preload.cjs
  - desktop/bootstrap.cjs
  - desktop/launcher.html
  - desktop/launcher.js
  - desktop/launcher.css
  - package.json
  - '!node_modules/**'
extraResources:
  - from: .next/standalone
    to: server
    filter:
      - '**/*'
  - from: .next/standalone/node_modules
    to: server/node_modules
    filter:
      - '**/*'
  - from: .next/static
    to: server/.next/static
  - from: prisma
    to: migration/prisma
    filter:
      - schema.prisma
      - migrations/**/*
  - from: node_modules/prisma
    to: migration/node_modules/prisma
  - from: node_modules/@prisma
    to: migration/node_modules/@prisma
mac:
  target:
    - dmg
  category: public.app-category.finance
  # A coherent local-test signature; Developer ID signing is needed for release.
  identity: '-'
  entitlements: desktop/entitlements.mac.plist
  entitlementsInherit: desktop/entitlements.mac.plist
win:
  target:
    - nsis
nsis:
  oneClick: true
  allowToChangeInstallationDirectory: false
artifactName: FWMS-${version}-${os}-${arch}.${ext}
